<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="HomePage.css">
    <link rel="stylesheet" href="orders.css">

    <title>My Orders & Live Status - MediFind</title>
</head>
<body>

    <!-- NAVBAR -->
    <div class="container">
        <div class="section1">
            <div class="logo">
                <div class="logo-icon">+</div>
                <span>MediFind</span>
            </div>
        </div>
        <div class="section2">
            <a class="home" href="HomePage.html">Home</a>
            <a class="findmedi" href="FindMedi.html">Find Medicine</a>
            <a class="pharmacies" href="Pharmacies.html">Pharmacies</a>
            <a class="orders" href="orders.html" style="color:#0284c7;font-weight:700;">My Orders</a>
        </div>
        <div class="section3">
            <a class="login" href="login.html">Login</a>
            <a class="register" href="register.html">Register</a>
        </div>
    </div>

    <!-- MAIN ORDERS VIEW -->
    <main class="orders-container">
        <div class="orders-header">
            <h1>My Medicine Orders</h1>
            <p>Track your medicine orders in real-time with verified pharmacy status updates.</p>
        </div>

        <div class="orders-layout">
            <!-- Left: Orders List -->
            <aside class="orders-list-panel">
                <h3 style="margin:0 0 16px 0;font-size:1.1rem;color:#0f172a;display:flex;justify-content:space-between;align-items:center;">
                    <span>Order History</span>
                    <span id="orders-count-badge" style="font-size:0.75rem;background:#e0f2fe;color:#0369a1;padding:3px 8px;border-radius:999px;">0 orders</span>
                </h3>
                <div id="orders-list-items">
                    <div style="text-align:center;padding:30px;color:#64748b;font-size:0.9rem;">
                        Loading your orders...
                    </div>
                </div>
            </aside>

            <!-- Right: Active Order Tracking Detail -->
            <section class="tracking-panel" id="order-detail-panel">
                <div style="text-align:center;padding:60px 20px;color:#64748b;">
                    <p style="font-size:1.1rem;">Select an order from the left to view live tracking details.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/order-modal.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
