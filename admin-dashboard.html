<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="HomePage.css">

    <title>Admin Verification Panel - MediFind</title>
</head>
<body>

    <!-- NAVBAR -->
    <div class="container">
        <div class="section1">
            <div class="logo">
                <div class="logo-icon">+</div>
                <span>MediFind</span>
            </div>
        </div>
        <div class="section2">
            <a class="home" href="HomePage.html">Home</a>
            <a class="pharmacies" href="Pharmacies.html">Pharmacies</a>
            <a class="admin" href="admin-dashboard.html" style="color:#0284c7;font-weight:700;">Admin Verification</a>
        </div>
        <div class="section3">
            <a class="login" href="login.html">Login</a>
            <a class="register" href="register.html">Register</a>
        </div>
    </div>

    <!-- MAIN ADMIN CONTAINER -->
    <main style="max-width:1100px;margin:40px auto;padding:0 20px;font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="margin-bottom:28px;">
            <div style="display:inline-block;background:#e0f2fe;color:#0369a1;padding:4px 12px;border-radius:999px;font-size:0.8rem;font-weight:700;margin-bottom:8px;">
                🛡️ ADMIN CONTROL PANEL
            </div>
            <h1 style="font-family:'Space Grotesk',sans-serif;font-size:2rem;color:#0f172a;margin:0 0 6px 0;">
                Pending Pharmacy Verifications
            </h1>
            <p style="color:#64748b;margin:0;font-size:0.95rem;">
                Review official drug licenses and approve or reject registered pharmacy partner stores.
            </p>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
            <div style="font-weight:700;color:#0f172a;font-size:1.1rem;">
                Pending Applications (<span id="pending-count">0</span>)
            </div>
            <button type="button" id="admin-refresh-btn" style="background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;padding:8px 16px;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer;">
                🔄 Refresh
            </button>
        </div>

        <div id="pending-pharmacies-list" style="display:flex;flex-direction:column;gap:18px;">
            <div style="text-align:center;padding:50px;color:#64748b;">
                Loading pending pharmacies...
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
